name: CRELICS static JavaScript validation

on:
  push:
    branches:
      - main
      - feat/crelics-adaptive-intelligence
  pull_request:

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate embedded JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('No inline script found in index.html');
          for (const [index, match] of scripts.entries()) {
            new vm.Script(match[1], { filename: `index.html:inline-script-${index + 1}` });
          }
          console.log(`Validated syntax for ${scripts.length} inline script(s).`);
          NODE
